<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Profissional</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Botão flutuante */
    .chatbot-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    /* Janela do chatbot */
    .chatbot-popup {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 320px;
      max-height: 400px;
      background-color: #b2f19c;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 999;
    }

    .chatbot-header {
        text-align: center;
      background-color: #384B31;
      color: white;
      padding: 15px;
      font-weight: bold;
    }

    .chatbot-body {
      padding: 10px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .chatbot-message {
      background-color: #f1f1f1;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      max-width: 80%;
    }

    .chatbot-message.user {
      align-self: flex-end;
      background-color: #DCF8C6;
    }

    .chatbot-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .chatbot-input input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    .chatbot-input button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Botão flutuante -->
<button class="chatbot-button" onclick="toggleChat()">🤖</button>

<!-- Janela do chatbot -->
<div class="chatbot-popup" id="chatbot">
  <div class="chatbot-header">Chat Bot</div>
  <div class="chatbot-body" id="chatbot-body">
    <div class="chatbot-message">Olá! Como posso ajudar?</div>
  </div>
  <div class="chatbot-input">
    <input type="text" id="chat-input" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
  function toggleChat() {
    const chat = document.getElementById("chatbot");
    chat.style.display = chat.style.display === "flex" ? "none" : "flex";
  }

  function sendMessage() {
    const input = document.getElementById("chat-input");
    const message = input.value.trim();
    if (!message) return;

    const chatBody = document.getElementById("chatbot-body");

    const userMsg = document.createElement("div");
    userMsg.className = "chatbot-message user";
    userMsg.textContent = message;
    chatBody.appendChild(userMsg);

    input.value = "";

    // Simula resposta do bot
    setTimeout(() => {
      const botMsg = document.createElement("div");
      botMsg.className = "chatbot-message";
      botMsg.textContent = "Estou analisando sua mensagem...";
      chatBody.appendChild(botMsg);
      chatBody.scrollTop = chatBody.scrollHeight;
    }, 500);
  }

  function handleKeyPress(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  }
</script>

</body>
</html>
