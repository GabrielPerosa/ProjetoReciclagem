<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <script src="/web/dashboard/script.js"></script>
</head>

<body>

  <div class="hamburger">
    <button id="hamburger-btn">
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <div class="overlay"></div>

  <div class="sidebar">
    <div class="user">
      <div class="circle">
        <i class="bx bxs-user"></i>
      </div>
    </div>

    <div class="titulo">
      <p>Bem-vindo, usuário.</p>
    </div>

    <a href="/web/dashboard/index.html" class="menu-btn"><i class="fas fa-chart-bar"></i> Dashboard</a>
    <a href="/web/monitoramento/index.html" class="menu-btn"><i class="fas fa-file-alt"></i> Monitoram.</a>

  
     <a href="/web/login/tela_de_login.html" class="logout"><i class="fas fa-sign-out-alt"></i>Logout</a>  
    
  </div>

  <div class="main">
    <div class="top-cards">
      <div class="card card-dados">
        <div class="card-header">
          <div class="icon blue"><i class="fas fa-calendar-day"></i></div>
          <span class="card-title">Dados de Hoje</span>
        </div>
        <div class="dados">
          <div class="dados-item"><span class="no-bar" id="rampa1hoje"></span><span>Metalica</span></div>
          <div class="dados-item"><span class="no-bar" id="rampa2hoje"></span><span>Plastica</span></div>
          <div class="dados-item"><span class="no-bar" id="descartehoje"></span><span>Descarte</span></div>
          <div class="dados-item"><span class="no-bar" id="pecas_totalhoje"></span><span>Total</span></div>
        </div>
      </div>

      <div class="card card-dados">
        <div class="card-header">
          <div class="icon yellow"><i class="fas fa-calendar-day"></i></div>
          <span class="card-title">Dados por Mês</span>
        </div>
        <div class="dados">
          <div class="dados-item"><span class="no-bar" id="rampa1"></span><span>Metalica</span></div>
          <div class="dados-item"><span class="no-bar" id="rampa2"></span><span>Plastica</span></div>
          <div class="dados-item"><span class="no-bar" id="descarte"></span><span>Descarte</span></div>
          <div class="dados-item"><span class="no-bar" id="pecas_total"></span><span>Total</div>
        </div>
      </div>

      <div class="card gauge-card">
        <div class="card-header">
          <div class="icon green"><i class="fas fa-percent"></i></div>
          <span class="card-title">Aproveitamento</span>
        </div>
        <div class="gauge-wrapper">
          <div class="progress-bar">
            <div class="progress-fill" id="aprove-diario"></div>
          </div>
          <div class="gauge-label" id="aprov-diario"></div>
        </div>
      </div>

      <div class="card gauge-card">
        <div class="card-header">
          <div class="icon green"><i class="fas fa-percent"></i></div>
          <span class="card-title">Aproveitamento Mensal</span>
        </div>
        <div class="gauge-wrapper">
          <div class="progress-bar">
            <div class="progress-fill" id="aprove-mensal"></div>
          </div>
          <div class="gauge-label" id="aprov-mensal">85%</div>
        </div>
      </div>
    </div>

    <div class="bottom-charts">
      <div class="card">
        <div class="card-header">
          <div class="icon gray"><i class="fas fa-chart-bar"></i></div>
          <span>Contador de peças</span>
        </div>
        <canvas id="pecasChart" style="max-width: 100%; height: 300px;"></canvas>
      </div>
    </div>
  </div>

 


  

  <script src="script.js"></script>
</body>

</html>
