<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Login</title>
  <link rel="stylesheet" href="tela_de_login.css">
  <!-- Link para ícones do Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div class="container">
    <div class="title">
      <img src="https://cdn-icons-png.flaticon.com/512/5974/5974156.png" alt="reciclagem" width="70" height="70">
    </div>

    <div class="login-form">
      <div class="tabs">
        <a href="/web/login/tela_de_login.html" class="tabs">Login</a>
        <a href="/web/cadastro/tela_de_cadastro.html" class="tabs">Cadastro</a>
      </div>

      <form>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="input-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required>
        </div>

      
        
      </form>  
      <div class="back-home">
        <a href="/web/dashboard/index.html" class="home-button">
          Entrar
        </a>
        <a href="/web/index.html" class="home-button">
          Voltar para página inicial
        </a>
      </div>
    </div>
  </div>
</body>

</html>
