version: '3.8'

services:
  postgres_db:
    image: postgres:16
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    networks:
      - backend

  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres_db
    networks:
      - backend
    command: /bin/bash -c "sleep 10 && python app/config/create_tables.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"  # Sem o 'routes', referenciando diretamente o 'app.main'

networks:
  backend:
    driver: bridge

volumes:
  pgdata: